# channel-core settings

# Event outbox (W1-07): days to keep events that are done, before the daily job channelPurgeOutbox deletes them.
outbox.retentionDays=7

# Event outbox (W1-07): after this many attempts (claims) an event is parked: claim skips it, purge keeps it, MCP action outbox_parked lists it.
outbox.maxAttempts=10
