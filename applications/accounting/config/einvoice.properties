###############################################################################
# E-invoices (EN 16931): XRechnung, ZUGFeRD / Factur-X, Peppol BIS Billing 3.0
# Values can be overridden per tenant with SystemProperty (systemResourceId=einvoice).
###############################################################################

# Format when neither the customer nor the organization has a PartyEInvoicePref.formatEnumId
# (XRECHNUNG_UBL, XRECHNUNG_CII, ZUGFERD, PEPPOL_BIS3, EN16931_UBL, EN16931_CII). Empty = no default.
einvoice.format.default=

# Unit code (UN/ECE Recommendation 20/21) of a line whose unit (Uom.unCefactCode) is unknown. H87 = piece.
einvoice.unit.default=H87

# Mustang computes the VAT per rate (EN 16931); Scipio rounds the VAT per line. A difference in the grand total
# up to max(min, perLine x lines) goes to the rounding amount (BT-114); a larger difference stops the export.
einvoice.rounding.tolerance.min=0.05
einvoice.rounding.tolerance.perLine=0.01

# VAT category (UNTDID 5305) of a line without tax when no other rule applies (intra-community supply K and
# export G are found from the countries): E = exempt, Z = zero rated, O = not subject to VAT.
einvoice.vat.category.noTax=E
# Exemption reason text (BT-120) for that category; empty = the generic text, and the check warns.
# A small business (Kleinunternehmer) sets the flag in the e-invoice settings of the organization instead.
einvoice.vat.exemptionReason.noTax=

# Language of the texts inside the e-invoice (payment terms, exemption reasons, item names), e.g. de.
# Empty = the language of the user who makes the e-invoice.
einvoice.document.locale=

# Countries (geoId) that are still in the Geo group EU of the seed data but are not EU members.
einvoice.eu.excludedCountries=GBR

# Payment means code (UNTDID 4461) of the seller bank account: 58 = SEPA credit transfer (EUR), 30 = credit transfer.
einvoice.paymentMeans.iban=58
einvoice.paymentMeans.other=30

# Hybrid PDF (ZUGFeRD / Factur-X): the screen of the visible invoice, and the producer in the PDF metadata.
# The screen is rendered as PDF/A-3b; all its fonts must be embeddable (fop.properties fop.font.family).
einvoice.pdf.screen=component://accounting/widget/AccountingPrintScreens.xml#InvoicePDF
einvoice.pdf.producer=Scipio ERP

# Import of received e-invoices: invoice item types of a line with a known product (SupplierProduct) and of other lines.
einvoice.import.itemType.product=PINV_FPROD_ITEM
einvoice.import.itemType.other=PINV_SUPLPRD_ITEM
