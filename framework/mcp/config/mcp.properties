# SCIPIO: 4.0.0: MCP (Model Context Protocol) settings.
# All values are read at runtime through UtilProperties("mcp").

# Enable/disable the endpoint on every webapp.
mcp.enabled=true
# Comma list of webapp names (e.g. ical,solr) that get no endpoint.
mcp.webapp.exclude=
# Path segment served in every webapp: https://host/<webapp>/mcp
mcp.path.segment=mcp

# Transport security
# Allow plain HTTP (dev only). Production must keep false.
mcp.allowInsecure=false
# Comma list of allowed browser Origin values. Empty = reject every request that carries an Origin header.
mcp.origin.allow=
# Comma list of allowed Host header values. Empty = no Host check.
mcp.host.allow=

# Limits
mcp.request.maxBytes=1048576
mcp.batch.maxSize=20
mcp.string.maxLength=65536
mcp.array.maxLength=1000
mcp.list.defaultLimit=50
mcp.list.maxLimit=500
mcp.result.maxChars=200000
mcp.session.idleMinutes=30
# SCIPIO: 4.0.0: pooled runtime: live MCP sessions per store and JVM; initialize fails above it (G6)
mcp.session.maxPerStore=1000
mcp.rateLimit.perMinute=120
mcp.rateLimit.anonymousPerMinute=60
mcp.rateLimit.failedAuthPerMinute=10
mcp.rateLimit.maxConcurrent=4
# The login "desk" of a hosted store (scipio-ai: the platform desk) makes the calls of the seller's app, the assistant and
# the store jobs with one token; the default above is for an agent token. A login without such a line takes the default.
mcp.rateLimit.perMinute.user.desk=1200
mcp.rateLimit.maxConcurrent.user.desk=16
mcp.service.timeoutSeconds=120

# Reverse proxies (exact address, dotted prefix such as 10.0., or IPv4 CIDR) whose X-Forwarded-Proto header is trusted.
# Empty = the header is ignored and a plain-HTTP request is rejected unless mcp.allowInsecure=true.
mcp.trustedProxies=
# Deepest JSON nesting accepted in a request body.
mcp.request.maxDepth=64

# Tokens
# User logins that may never own or use a token.
mcp.token.denyUsers=system,anonymous
# Expiry applied when a token is created without one, and the largest expiry a creator may request.
mcp.token.defaultExpiryDays=90
mcp.token.maxExpiryDays=365
# When false (default), a token row without an expiry date is rejected at authentication time.
mcp.token.allowNoExpiry=false

# Policy
# Comma list of service name patterns (* wildcard, case-insensitive) that no token can ever call through the gateway.
mcp.service.deny=*SecurityGroup*,*SecurityPermission*,entityImport*,entityExport*,*Sql*,runService,purge*,*McpAccessToken*,updatePassword,resetPassword*,scheduleService*,*JobSandbox*,sendMail*,*Keystore*,*X509*
# Comma list of service name patterns that only users with MCP_ADMIN may call (user login and password management).
mcp.service.adminOnly=*UserLogin*,*Password*
# Comma list of entity name patterns that no token can ever read or write through the entity tools.
mcp.entity.deny=UserLogin*,*Password*,*CreditCard*,*EftAccount*,*PaymentGatewayConfig*,*Secret*,Mcp*,Security*,SystemProperty,Tenant*,*Keystore*,X509*,JobSandbox*
# SystemProperty resources that MCP never reads or writes, even when SystemProperty leaves the deny list (hubcheckout is always in)
mcp.entity.protectedSystemResources=hubcheckout
# Classify services as read-only by name prefix (get, find, list, search, lookup, count, calculate, is, has, describe, check) when no better signal exists.
mcp.gateway.readOnlyHeuristic=true
# Allow services without any permission declaration through the gateway with the owning component's base permission (_VIEW or _UPDATE).
mcp.gateway.allowUnguarded=true
# Components with no webapp (so no base permission) whose services may run with the endpoint webapp's base permission instead of MCP_ADMIN.
mcp.gateway.openComponents=common
# Tools (tool, server.tool) or actions (tool:action) removed from every server at registry build, e.g. scipio_entity:store,shop.shop_cart
mcp.tool.disable=
# EmailTemplateSetting ids (approved templates) that the mail_send_template tool may send; needs MCP_MAIL_SEND.
mcp.mail.templates=MCP_PURCHASE_ORDER,MCP_STATEMENT,MCP_CUSTOMER_NOTICE

# Redaction: field names (exact, case-insensitive) and name globs masked in results, argument echoes and audit rows.
mcp.redact.fields=password,currentPassword,newPassword,cardNumber,securityCode,encryptedValue,ssn,socialSecurityNumber,tokenHash,accountNumber,routingNumber,apiKey,secretKey,clientSecret,pinNumber
mcp.redact.patterns=*password*,*secret*,*privatekey*,*accesstoken*,*refreshtoken*,*apikey*,*cardnumber*,*securitycode*,*cvv*,*pinnumber*,*tokenhash*

# Audit
mcp.audit.enabled=true
mcp.audit.argsMaxChars=4000
# Largest result stored for idempotent replay; a longer result is not stored and a repeat call runs again.
mcp.audit.resultMaxChars=65536
mcp.usage.flushSeconds=60
