mail.smtp.relay.host=localhost

# -- SMTP Auth settings
#mail.smtp.auth.user=
#mail.smtp.auth.password=

# -- Additional Required Fields needed for Gmail and other non traditional smtp servers
# -- These added fields also work for Yahoo business mail for instance
# -- Gmail smtp port can be either 465 or 587
mail.smtp.port=465
# -- Gmail requires StartTLS
#mail.smtp.starttls.enable=true

# -- Gmail requires a JSSE socket factory, the following socketFactory settings will override JavaMail's default socketFactory settings
# -- Port needs to be the same as mail.smtp.port
#mail.smtp.socketFactory.port=465
#mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
#--Fallback [true|false] determines whether you will allow a non secure connection if you are unable to get a secure one
#mail.smtp.socketFactory.fallback=false

# -- how the address are matched with the CRM addresses
mail.address.caseInsensitive=N

# -- debug SMTP mail option enabled (Y|N)
mail.debug.on=N

# -- if some addresses fail the SMTP check using the RCPT TO: command then setting this property to false will abort sending the message
#    to any recipients valid or not
mail.smtp.sendpartial=true

# -- HTTP upload settings
# -- directory used to temporarily store files that are larger than the configured size threshold (10K)
http.upload.max.sizethreshold=10240
# -- directory used to temporarily store files that are larger than the configured size threshold
http.upload.tmprepository=runtime/tmp
# -- max size in bytes (-1 for unlimited)
http.upload.max.size=-1

# -- spam header name and value to block incoming spam detected by external spam checker, configured for spam assin
mail.spam.name=X-Spam-Flag
mail.spam.value=YES

# -- HTTP JSON settings
http.json.xssi.prefix=//

# -- Save Entity Sync Remove Info. This is used in the context of Entity Sync, doc currently updated, WIP at OFBIZ-10390...  
# SCIPIO: NOTE: 2019-09-02: The default has been changed to false; set to true as needed or for backward-compability
saveEntitySyncRemoveInfo=false

# -- Y if you want to display the multi-tenant textbox in the login page and install specify components which related to each tenant
multitenant=N

# SCIPIO: 4.0.0: Pooled runtime (multitenant=Y): many stores (tenants) in one JVM, one database per store.
# The master tables (Tenant, TenantDataSource, TenantDomainName, McpTokenRoute) live in the base delegator.
#tenant.baseDelegator=default
# Hosts that serve the base delegator; any host without a TenantDomainName row and not listed here gets 404.
# The host map is cached for cacheTtlMs; the store state and plan (Tenant row) for tenant.info.cacheTtlMs.
#tenant.resolver.baseHosts=localhost,127.0.0.1
#tenant.resolver.cacheTtlMs=5000
#tenant.info.cacheTtlMs=5000
# Request slots per store and JVM: -1 (default) = the plan of the store (tenant.plan.<planId>.requestSlots and
# heavyRequestSlots); 0 = no limit. URIs that match heavyRequestPattern (reports, exports, back-office apps) use the
# heavy slots. A request that finds no free slot within maxWaitMs gets 503 with Retry-After. Keep the wait short: a
# waiting request holds a server thread, and long waits under load fill the thread pool of the whole JVM.
# Keep requestSlots + heavyRequestSlots below the connection pool size of the store (dbPoolMax): a request holds one
# connection, and a sequence bank refill (getNextSeqId) needs a second one from the same pool.
#tenant.resolver.maxConcurrentRequests=-1
#tenant.resolver.maxConcurrentHeavyRequests=-1
#tenant.resolver.heavyRequestPattern=.*\\.(pdf|csv|xls|xlsx|xml)$|^/(ordermgr|accounting|webtools|admin|facility|catalog)/.*
#tenant.resolver.maxWaitMs=250
# Heavy work (W1-01c, TenantLoad): heavy requests and the jobs whose service matches tenant.heavy.servicePattern.
# Per store (plan): heavyRequestSlots run at once, heavyQueue more wait up to tenant.heavy.maxWaitMs for a slot, and a
# time budget: the store's heavy work may run heavyShare percent of the time of one thread on average; a full budget
# gives heavyBurstSeconds at full speed. A heavy thread pays its run time at its database calls, but it never waits
# there (no wait with an open transaction, result set or row lock). It waits only before it starts, with no
# transaction and no JVM slot: a heavy request waits in the store queue (429 with Retry-After, the seconds until its
# budget is back, when the wait is longer than maxWaitMs); a heavy job waits before its service starts (at most
# maxWaitMs). A long report or job runs to its end; its debt (at most heavyBurstSeconds) delays the next heavy work of
# the store. Best effort: only the URIs of heavyRequestPattern and the services of servicePattern pay into the budget;
# other requests have the request slots, other jobs jobThreads, and all database work of the store dbPoolMax.
# All stores together: at most maxPerJvm heavy requests run at once (-1 = CPUs / 2, at least 2); a request that finds
# no JVM slot within maxWaitMs gets 503 with Retry-After.
# tenant.resolver.maxConcurrentHeavyRequests=0 turns the heavy limits off.
#tenant.heavy.maxPerJvm=-1
#tenant.heavy.maxWaitMs=10000
#tenant.heavy.servicePattern=rebuildSolrIndex.*|.*(Export|Import|Report|Sitemap).*
# Plans (G17): the limits of a store come from tenant.plan.<Tenant.planId>.<limit>, then tenant.plan.default.<limit>,
# then the built-in value shown here. A store without planId uses tenant.plan.defaultPlanId.
#   requestSlots, heavyRequestSlots: request slots per JVM; jobsPerPoll: jobs per poll cycle of the shared job queue
#   (service.properties jobManager.poll.maxJobsPerManager=-1); dbPoolMax: connections of the store's pool (overrides
#   the datasource pool-maxsize); mailPerDay: mails per day and JVM (0 = no limit);
#   heavyQueue, heavyShare (percent of one thread), heavyBurstSeconds: heavy work (see above); jobThreads: queued or
#   running jobs of the store at once per JVM (0 = no cap; the job poller takes no more jobs of the store).
#tenant.plan.defaultPlanId=default
#tenant.plan.default.requestSlots=4
#tenant.plan.default.heavyRequestSlots=1
#tenant.plan.default.jobsPerPoll=3
#tenant.plan.default.dbPoolMax=12
#tenant.plan.default.mailPerDay=500
#tenant.plan.default.heavyQueue=2
#tenant.plan.default.heavyShare=25
#tenant.plan.default.heavyBurstSeconds=20
#tenant.plan.default.jobThreads=2
#tenant.plan.growth.requestSlots=8
#tenant.plan.growth.heavyRequestSlots=2
#tenant.plan.growth.jobsPerPoll=6
#tenant.plan.growth.dbPoolMax=14
#tenant.plan.growth.mailPerDay=5000
#tenant.plan.growth.heavyQueue=4
#tenant.plan.growth.heavyShare=50
#tenant.plan.growth.heavyBurstSeconds=60
#tenant.plan.growth.jobThreads=3
# Connection pools (G12): a store pool without a borrow for this many seconds closes (0 = never); a suspend closes
# the store's pools at once.
#tenant.pool.idleCloseSeconds=900
# Ids per refill of an entity sequence bank (default 10, 200 with multitenant=Y; an entity can set its own). A refill
# needs a second connection in its own transaction, so small per-store pools want larger banks.
#entity.sequence.defaultBankSize=
# Worker JVM (G10): Y = create the dispatcher of every active store at start and every scanSeconds, so that the jobs
# of every store run (also of a store without web requests). Web JVMs keep N and set serviceengine.xml
# thread-pool poll-enabled="false".
#tenant.worker.activateAll=N
#tenant.worker.scanSeconds=30
# Mail (G9): the From address of a store mail must use a host of the store (TenantDomainName), that host without
# "www.", or a platformDomain. Another From address is replaced by platformSender (${tenantId} expands; the original
# address becomes Reply-To), or refused when platformSender is empty. A mail takes one unit of the plan's mailPerDay
# when it goes to the relay.
#tenant.mail.senderDomainCheck=true
#tenant.mail.platformDomains=
#tenant.mail.platformSender=
# Files (G7): object storage for store files, key tenants/<tenantId>/<area>/<path>. none (default), local or s3.
# A JVM mirrors the store files it writes (images, sitemaps) into the storage; a JVM that lacks a file reads it there.
#tenant.storage.type=none
#tenant.storage.local.root=runtime/tenant-storage
#tenant.storage.s3.endpoint=https://fsn1.your-objectstorage.com
#tenant.storage.s3.region=eu-central
#tenant.storage.s3.bucket=
#tenant.storage.s3.accessKey=
#tenant.storage.s3.secretKey=
#tenant.storage.imagesRoot=framework/images/webapp/images
# Provisioning (G18, service provisionTenant): the store database is a copy of templateDatabase, made through the
# admin connection (PostgreSQL, directly, not through PgBouncer); the TenantDataSource rows get jdbcUri
# (${databaseName} expands; usually PgBouncer with prepareThreshold=0). initSql runs once on the new database.
#tenant.provision.adminJdbcUri=jdbc:postgresql://127.0.0.1:5432/postgres
#tenant.provision.adminJdbcUsername=
#tenant.provision.adminJdbcPassword=
#tenant.provision.templateDatabase=commerce_seed
#tenant.provision.databaseName=t_${tenantId}
#tenant.provision.createOptions=STRATEGY FILE_COPY
#tenant.provision.jdbcUri=jdbc:postgresql://127.0.0.1:5432/${databaseName}
#tenant.provision.jdbcUsername=
#tenant.provision.jdbcPassword=
#tenant.provision.entityGroups=org.ofbiz,org.ofbiz.olap
#tenant.provision.initSql=component://common/config/tenant-init.sql


# SCIPIO: Global pagination defaults.
# NOTE: Some components have their own specific settings from stock Ofbiz. Also see the following files and properties:
#   widget.properties - widget.form.defaultViewSize
#   content.properties - viewSize

# Global default, used mainly for non-widget code. widget code usually uses widget.form.defaultViewSize as default instead.
record.paginate.defaultViewSize=20
# This is used when pagination is disabled. Sometimes it is really used in lookups in these cases, so don't make this an extreme value.
record.paginate.disabled.defaultViewSize=99999

# SCIPIO: Global default rendering exception handling default, used for example in Freemarker configuration
# Possible values: RETHROW (default if omitted - most secure), DEBUG (development default), BLANK, DEBUG_RETHROW
render.global.exception.mode=DEBUG

# SCIPIO: Boolean, controls whether the ControlServlet allows printing transaction rollbacks and other errors
# when a request forward is not possible. Default: true if render.global.exception.mode is DEBUG or DEBUG_*, false otherwise.
render.global.error.fallback.print=

# SCIPIO: Allows to provide alternate implementations of the Freemarker ObjectWrappers used in Scipio
# NOTE: This should be avoided if possible. Instead, try providing wrapper factories using freemarkerWrapperFactories.properties.
render.global.systemObjectWrapperFactory=org.ofbiz.base.util.template.ScipioFtlWrappers$DefaultScipioObjectWrapperFactory

