# Agentic Commerce Protocol (ACP) settings. Every value can be set per store in SystemProperty
# (systemResourceId "acp") and per product store with the suffix ".<productStoreId>", for example
# stripe.secretKey.SCIPIO_STORE. Environment variables of the form ACP_STRIPE_SECRET_KEY win over the file.

# Master switch. Off: every /acp path and /.well-known/acp.json answer 404.
enabled=true

# The protocol version that this server speaks, and the versions that it accepts in the API-Version header.
api.version=2026-04-17
api.supportedVersions=2025-09-29,2025-12-12,2026-01-16,2026-01-30,2026-04-17

# The public address of the store webapp (https://shop.example.com/shop), per store with baseUrl.<productStoreId>.
# Empty: the scheme and host of the request (behind a proxy, set them with the Tomcat RemoteIpValve). Client headers
# such as X-Forwarded-Host are never read.
baseUrl=

# Webapps that never answer ACP (comma list of webapp names). Webapps without a web site and product store never answer.
excludedWebapps=

# The permission that an agent token needs (the login of the token must have it).
permission=ACP_CHECKOUT

# Requests per minute per token.
rateLimit.perMinute=120

# Minutes until an open checkout session expires.
session.ttlMinutes=360

# Minutes that an idempotency key is kept.
idempotency.ttlMinutes=1440

# The payment handler: "stripe" (the store's own Stripe account), "hub" (the Scipio hub, EXT_STRIPE_HUB) or "auto"
# (hub when hubcheckout.properties has storeId, url and key, else stripe when a secret key is set).
payment.handler=auto

# Stripe: the secret key of the store's account (sk_live_... / sk_test_... / rk_...). Leave empty in the file;
# set it as SystemProperty or as the environment variable ACP_STRIPE_SECRET_KEY.
stripe.secretKey=
stripe.apiBase=https://api.stripe.com
# The Stripe API version that accepts shared_payment_granted_token.
stripe.apiVersion=2026-09-30.preview
# The account id that the handler config shows to the agent (acct_...), optional.
stripe.accountId=

# The order webhook of the agent (POST, order_create / order_update) and its HMAC secret. Empty url = no webhooks.
webhook.url=
webhook.secret=
# Attempts before a delivery is parked.
webhook.maxAttempts=8

# Optional request signature check: when set, every request must carry Signature + Timestamp
# (base64 HMAC-SHA256 over "<Timestamp>.<raw body>" with this secret), not older than signature.maxSkewSeconds.
signature.secret=
signature.maxSkewSeconds=300

# Product feed: the catalog that the feed reads when the store has more than one, and the max products.
feed.prodCatalogId=
feed.maxProducts=50000
# Seller policy links of the checkout session (absolute, or relative to the store web address).
link.terms_of_use=/control/legal
link.privacy_policy=/control/privacyCenter
link.return_policy=/control/policies
link.shipping_policy=/control/policies
