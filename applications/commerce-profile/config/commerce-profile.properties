# SCIPIO: 4.0.0: Commerce profile (W1-02), blueprint section 5 and 09 section 6.3.
#
# scipio.hosted=true switches on the hosted rules: no code action for a store login or a store token.
# The pod JVM sets it with -Dscipio.hosted=true (a system property wins over this file).
# The default is false: a self-hosted server and the dev server keep the full code rights.
scipio.hosted=false

# Files that entityImport may load in a hosted store (relative to ofbiz.home): the files of the setup wizard
# (SetupEvents.xml, SetupServices.java, SetupDataUtil.java). Any other file, fulltext or URL is refused.
hosted.import.allow=applications/accounting/data/DemoGeneralChartOfAccounts.xml,applications/commonext/data/GlAccountData.xml,applications/commonext/data/ShippingData.xml,applications/commonext/data/ProductStoreData.xml
